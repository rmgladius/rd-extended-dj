[project]
name = "rd-extended-dj"
version = "1.0.0"
description = "Gera intro e outro em loop (extended) para mixar em beat match"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "soxr>=0.3",
    "librosa>=0.10.2",
    "torch>=2.4",
    "torchaudio>=2.4",
    "demucs>=4.1.0",
    "beat-this>=1.1.0",
    "onnxruntime>=1.18",
    "tqdm>=4.66",
    "pywebview>=5.4",
    "segno>=1.6.6",
]

[project.scripts]
extdj = "extdj.cli:main"
extdj-app = "extdj.app.janela:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "zxing-cpp>=3.1.1",
]
# só para gerar o .exe (rodar no Windows): uv sync --group empacotar
empacotar = ["pyinstaller>=6.11", "pillow>=10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extdj"]

# No Windows o torch do PyPI vem sem CUDA; puxa a versão com CUDA do índice oficial.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

# O PyTorch parou de sair para Mac Intel na 2.2; ficam Windows, Linux e Mac com chip M.
[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
